name: release-checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: |
          python ns_candidate.py verify
          python ns_candidate.py evaluate
          python -m pytest -q -W error tests
      - name: Replay full scientific rejection
        shell: bash
        run: |
          set +e
          python ns_candidate.py validate --candidate ST054-Q2 --out outputs/Q2.json
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/Q2.json').read_text())
          y=json.loads(Path('evidence/replay/ST054-Q2_9175491.json').read_text())
          assert x['gates']==y['gates']
          assert x['candidate_sha256']==y['candidate_sha256']
          for a,b in zip(x['spatial_refinement'],y['spatial_refinement']):
              assert abs(a['momentum_max']-b['momentum_max'])<1e-7
              assert abs(a['momentum_L2']-b['momentum_L2'])<1e-7
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-release-replay
          path: outputs/
  matlab:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb x11-utils
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      - name: Start display
        run: |
          Xvfb :99 -screen 0 1600x1200x24 > /tmp/xvfb.log 2>&1 &
          sleep 3
          DISPLAY=:99 xdpyinfo > /dev/null
      - uses: matlab-actions/run-command@v2
        env:
          DISPLAY: ':99'
        with:
          command: addpath('visualization/matlab'); ns_release_test('outputs/matlab');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-matlab-release
          path: outputs/matlab/
