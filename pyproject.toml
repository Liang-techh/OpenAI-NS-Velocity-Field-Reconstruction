[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-field-reconstruction"
version = "0.3.0"
description = "Reproducible finite-window Navier-Stokes candidates and native MATLAB field visualization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "sympy>=1.12,<2"]

[project.scripts]
ns-field = "ns_reconstruction.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ns_reconstruction = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
