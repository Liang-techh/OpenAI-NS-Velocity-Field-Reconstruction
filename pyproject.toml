[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-ns-velocity-field-reconstruction"
version = "0.2.0"
description = "Partial, auditable numerical reconstruction of a Navier-Stokes velocity-field construction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ns-reconstruct = "openai_ns_reconstruction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
