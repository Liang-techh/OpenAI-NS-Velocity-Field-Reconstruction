name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice:
    name: slice-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: coordinates
            path: tests/test_coordinates.py
          - case: velocity
            path: tests/test_velocity.py
          - case: forcing
            path: tests/test_forcing.py
          - case: provenance
            path: tests/test_provenance_manifest.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test ${{ matrix.case }}
        run: python -m pytest -q -W error "${{ matrix.path }}"

  full:
    name: full-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test full suite
        run: python -m pytest -q -W error

  compatibility:
    name: compatibility-py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: '1.24.4'
          - python: '3.13'
            numpy: '2.3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install 'numpy==${{ matrix.numpy }}' -e '.[dev]'
      - name: Test
        run: python -m pytest -q -W error
      - name: Numerical diagnostics and labelled demo
        run: |
          ns-reconstruct verify --output diagnostics.json
          ns-reconstruct demo --output smoke-demo --grid-size 9
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-py${{ matrix.python }}
          path: |
            diagnostics.json
            smoke-demo/
