name: tests

on:
  push:
  pull_request:

jobs:
  slice:
    name: slice-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: coordinates
            path: tests/test_coordinates.py
          - case: velocity
            path: tests/test_velocity.py
          - case: forcing
            path: tests/test_forcing.py
          - case: provenance
            path: tests/test_provenance_manifest.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test ${{ matrix.case }}
        run: python -m pytest -q "${{ matrix.path }}"

  full:
    name: full-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test full suite
        run: python -m pytest -q
