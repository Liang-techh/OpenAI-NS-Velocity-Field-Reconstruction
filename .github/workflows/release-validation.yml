name: release-validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: st054-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-and-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - run: python tools/prepare_release.py
      - run: python -m pip install -e '.[test]' wheel
      - run: |
          python -m pytest -q -W error
          python tools/wheel_smoke.py
          ns-field verify
          ns-field evaluate
      - run: python tools/replay_release.py --out outputs/replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST054-independent-replay
          path: outputs/replay/
          if-no-files-found: error
  native-matlab:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      DISPLAY: ':99'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils
          Xvfb :99 -screen 0 1800x1300x24 -nolisten tcp > /tmp/ns-xvfb.log 2>&1 &
          sleep 2
          xdpyinfo -display :99 > /tmp/ns-display.txt
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true
      - uses: matlab-actions/run-command@v3
        with:
          startup-options: -display :99
          command: prepare_matlab; addpath('visualization/matlab'); f=fullfile(pwd,'visualization','matlab','data','st054_models.mat'); ns_selftest(f,true,fullfile(pwd,'outputs','matlab')); ns_callback_test(f,fullfile(pwd,'outputs','matlab')); ns_core_selftest(f,fullfile(pwd,'outputs','core'));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST054-native-MATLAB-and-core
          path: |
            outputs/matlab/
            outputs/core/
          if-no-files-found: error
