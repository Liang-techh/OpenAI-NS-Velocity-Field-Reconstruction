name: release-build
on:
  push:
    branches: [release/st054-code-and-docs]
    paths: [.github/workflows/release-build.yml]
permissions:
  contents: write
concurrency:
  group: st054-release-build
  cancel-in-progress: false
jobs:
  assemble-and-test:
    if: github.repository == 'Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DISPLAY: ':99'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pytest>=8,<10' 'sympy>=1.12,<2' 'setuptools>=68' wheel
      - name: Import only pinned, checksum-verified source and field data
        run: python tools/build_release.py
      - run: python -m pip install -e '.[test]'
      - name: Test Python API, package data and installed wheel
        run: |
          python -m pytest -q -W error
          python tools/wheel_smoke.py
          ns-field evaluate
      - name: Reproduce all four original independent numerical rejections
        run: python tools/replay_release.py --out evidence/replay
      - name: Start virtual display for actual native MATLAB UI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils
          Xvfb :99 -screen 0 1800x1300x24 -nolisten tcp > /tmp/ns-release-xvfb.log 2>&1 &
          sleep 2
          xdpyinfo -display :99 > /tmp/ns-release-display.txt
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true
      - uses: matlab-actions/run-command@v3
        with:
          startup-options: -display :99
          command: addpath('visualization/matlab'); f=fullfile(pwd,'visualization','matlab','data','st054_models.mat'); ns_selftest(f,true,fullfile(pwd,'evidence','release','matlab')); ns_callback_test(f,fullfile(pwd,'evidence','release','matlab')); ns_core_selftest(f,fullfile(pwd,'evidence','release','core')); a=ns_presentation_view('Visible','off'); assert(isempty(getappdata(a.Figure,'LastRenderError'))); a.Figure.Visible='on'; drawnow; pause(1); exportapp(a.Figure,fullfile(pwd,'assets','release_presentation.png')); a.Close(); copyfile(fullfile(pwd,'evidence','release','core','core_explorer.png'),fullfile(pwd,'assets','release_core.png'));
      - name: Attempt only the requested repository description update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          url='https://api.github.com/repos/Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction'
          description=Path('ABOUT.txt').read_text().strip()
          req=urllib.request.Request(url,data=json.dumps({'description':description}).encode(),method='PATCH',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ST054-authorized-release'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
              receipt={'updated':result.get('description')==description,'description':result.get('description'),'http_status':200}
          except urllib.error.HTTPError as e:
              result=json.loads(e.read());receipt={'updated':False,'http_status':e.code,'message':result.get('message'),'requested_description':description,'scope':'Standard workflow token lacks repository-administration access; no permission bypass attempted.'}
          Path('evidence/release/description_update.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Record tested source and hashes, then publish only to this release branch
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          tracked={}
          for root in ('src/ns_reconstruction','visualization/matlab'):
              for p in Path(root).rglob('*'):
                  if p.is_file() and '__pycache__' not in p.parts:tracked[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('evidence/release/build_receipt.json').write_text(json.dumps({'tested_source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'python_tests_passed':True,'installed_wheel_passed':True,'full_four_report_replay_passed':True,'native_matlab_and_core_passed':True,'files':tracked,'pde_validated':False},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ns_reconstruction/_runtime src/ns_reconstruction/data visualization/matlab/data visualization/matlab/ns_*.m assets evidence
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified ST054 assets, four replays and native MATLAB/core test evidence'
          git push origin HEAD:release/st054-code-and-docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ST054-release-build-evidence
          path: |
            evidence/
            assets/
            src/ns_reconstruction/data/
            visualization/matlab/data/
          if-no-files-found: error
