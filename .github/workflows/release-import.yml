name: release-import
on:
  push:
    branches: [release/st054-english-rebuild]
    paths: [.github/workflows/release-import.yml]
permissions:
  contents: write
jobs:
  import-pinned-assets:
    if: github.repository == 'Liang-techh/OpenAI-NS-Velocity-Field-Reconstruction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/st054-english-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - run: python tools/build_release.py
      - name: Commit pinned assets only to the release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ns_reconstruction/_runtime src/ns_reconstruction/data visualization/matlab assets evidence
          git diff --cached --quiet && exit 0
          git commit -m 'Import checked ST054 numerical arrays, native MATLAB data and provenance'
          git push origin HEAD:release/st054-english-rebuild
